# Additive overlay: existing postgres, redis, OPA and development port overlays remain intact.
services:
  app-api:
    image: ${NODE_IMAGE:?lock NODE_IMAGE}
    user: '10001:10001'
    restart: unless-stopped
    init: true
    working_dir: /app
    command: [node, --env-file=/run/secrets/p1-api.env, apps/api/dist/p1.js]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=128m,mode=1777']
    volumes:
      - ${P1_RELEASE_DIR:?explicit immutable P1 release}:/app:ro
      - /data/hsbc/secrets/p1-api.env:/run/secrets/p1-api.env:ro
    ports: ['127.0.0.1:3000:3000']
    extra_hosts: ['autodl-3090:172.30.90.1']
    networks: [app, rules]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  app-worker:
    image: ${NODE_IMAGE:?lock NODE_IMAGE}
    user: '10001:10001'
    restart: unless-stopped
    init: true
    working_dir: /app
    command: [node, --env-file=/run/secrets/p1-worker.env, apps/worker/dist/p1.js]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=256m,mode=1777']
    volumes:
      - ${P1_RELEASE_DIR:?explicit immutable P1 release}:/app:ro
      - /data/hsbc/secrets/p1-worker.env:/run/secrets/p1-worker.env:ro
    extra_hosts: ['autodl-3090:172.30.90.1']
    networks: [app, rules]
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
