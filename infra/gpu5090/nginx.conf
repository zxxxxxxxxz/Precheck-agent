user nobody nogroup;
worker_processes 2;
pid /data/hsbc/run/nginx.pid;
error_log stderr crit;
events { worker_connections 1024; }
http {
    server_tokens off;
    map_hash_bucket_size 128;
    client_body_temp_path /data/hsbc/tmp/nginx-client;
    proxy_temp_path /data/hsbc/tmp/nginx-proxy;
    map $http_authorization $hsbc_authorized {
        default 0;
        include /data/hsbc/secrets/nginx-bearer.map;
    }
    # Never log query strings, Authorization headers, prompts, or outputs.
    log_format safe '$time_iso8601 status=$status method=$request_method '
                    'duration=$request_time bytes=$body_bytes_sent';
    access_log /dev/stdout safe;
    upstream qwen { server 127.0.0.1:8000; keepalive 8; }
    server {
        listen 127.0.0.1:6006;
        server_name _;
        # One bounded 10 MiB PNG becomes at most 14 MiB base64 + JSON.
        client_max_body_size 15m;
        # Server rewrite phase runs before every location, including health/404.
        if ($hsbc_authorized = 0) { return 401; }
        if ($args != "") { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        # /data is under root's private home; do not spool request bodies there
        # from the unprivileged worker. Stream JSON directly to loopback vLLM.
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        location = /health/live {
            default_type application/json;
            return 200 '{"status":"alive"}';
        }
        location = /health/ready {
            limit_except GET { deny all; }
            proxy_pass http://qwen/health;
        }
        location = /v1/models {
            limit_except GET { deny all; }
            proxy_pass http://qwen;
        }
        location = /v1/chat/completions {
            limit_except POST { deny all; }
            proxy_pass http://qwen;
        }
        location = /v1/completions {
            limit_except POST { deny all; }
            proxy_pass http://qwen;
        }
        location / { return 404; }
    }
}
