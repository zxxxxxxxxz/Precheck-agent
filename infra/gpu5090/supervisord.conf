[unix_http_server]
file=/data/hsbc/run/supervisor.sock
chmod=0700
[supervisord]
logfile=/data/hsbc/logs/supervisor.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/data/hsbc/run/supervisord.pid
childlogdir=/data/hsbc/logs
umask=027
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///data/hsbc/run/supervisor.sock
[program:hsbc-nginx]
command=/usr/sbin/nginx -c /data/hsbc/config/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/data/hsbc/logs/nginx-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
[program:hsbc-qwen]
command=/data/hsbc/scripts/serve-qwen.sh
directory=/data/hsbc
autostart=true
autorestart=true
startsecs=20
startretries=3
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/data/hsbc/logs/qwen.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
