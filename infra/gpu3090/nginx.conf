worker_processes 1;
pid /data/hsbc/run/nginx3090.pid;
error_log /data/hsbc/logs/nginx3090-error.log crit;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 11m;
    client_body_temp_path /data/hsbc/tmp/nginx-client;
    proxy_temp_path /data/hsbc/tmp/nginx-proxy;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    # /data traverses the private /root directory; stream uploads to the model
    # process rather than requiring the unprivileged worker to spool there.
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    server {
        listen 127.0.0.1:6006;
        location ~ ^/(health/(live|ready)|v1/ocr)$ { proxy_pass http://127.0.0.1:8001; }
        location / { return 404; }
    }
    server {
        listen 127.0.0.1:6008;
        location ~ ^/(health/(live|ready)|v1/(entities|classify))$ { proxy_pass http://127.0.0.1:8002; }
        location / { return 404; }
    }
}
