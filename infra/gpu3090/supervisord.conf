[unix_http_server]
file=/data/hsbc/run/supervisor3090.sock
[supervisord]
logfile=/data/hsbc/logs/supervisor3090.log
pidfile=/data/hsbc/run/supervisor3090.pid
logfileMaxbytes=10MB
logfileBackups=3
[program:hsbc-ocr]
command=/data/hsbc/envs/ocr/bin/python -m uvicorn service:app --host 127.0.0.1 --port 8001 --no-access-log
directory=/data/hsbc/app/gpu3090
environment=MODEL_SERVICE="ocr",HF_HOME="/data/hsbc/cache/huggingface",PADDLE_PDX_CACHE_HOME="/data/hsbc/cache/paddlex",PADDLE_PDX_MODEL_SOURCE="bos",PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK="True",TMPDIR="/data/hsbc/tmp",FLAGS_allocator_strategy="auto_growth",OMP_NUM_THREADS="4"
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/data/hsbc/logs/ocr.log
stderr_logfile=/data/hsbc/logs/ocr-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
[program:hsbc-ner]
command=/data/hsbc/envs/ner/bin/python -m uvicorn service:app --host 127.0.0.1 --port 8002 --no-access-log
directory=/data/hsbc/app/gpu3090
environment=MODEL_SERVICE="ner",HF_HOME="/data/hsbc/cache/huggingface",HF_HUB_OFFLINE="1",TMPDIR="/data/hsbc/tmp",OMP_NUM_THREADS="4"
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/data/hsbc/logs/ner.log
stderr_logfile=/data/hsbc/logs/ner-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
[program:hsbc-model-proxy]
command=/usr/sbin/nginx -c /data/hsbc/config/nginx/gpu3090.conf -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/data/hsbc/logs/nginx3090.log
stderr_logfile=/data/hsbc/logs/nginx3090-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
